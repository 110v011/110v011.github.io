<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Slope3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }

  /* 左上UI（スコア） */
  #ui {
    position: fixed; top: 10px; left: 10px;
    color: #fff; font-family: sans-serif; font-size: 16px;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 4px;
    display: none;
  }

  /* タイトル画面 */
  #titleScreen {
    position: fixed;
    width: 100%; height: 100%;
    background: linear-gradient(#000428, #004e92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
  }
  #titleScreen h1 {
    font-size: 80px;
    margin-bottom: 40px;
  }
  #startBtn {
    font-size: 40px;
    padding: 20px 60px;
    border: none;
    border-radius: 10px;
    background: #00aaff;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px #00aaff;
  }

  /* Ready / Go 演出 */
  #readyGo {
    position: fixed;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 80px;
    font-weight: bold;
    color: white;
    opacity: 0;
    pointer-events: none;
    font-family: sans-serif;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
    transition: opacity 0.6s ease;
  }

  /* ゲームオーバー画面 */
  #gameOverScreen {
    position: fixed;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    top: 0; left: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    font-family: sans-serif;
    text-shadow: 0 0 20px black;
  }
  #gameOverScreen h1 {
    font-size: 80px;
    margin-bottom: 20px;
  }
  #finalScore {
    font-size: 40px;
    margin: 20px;
  }
  #restartBtn {
    font-size: 40px;
    padding: 20px 60px;
    border: none;
    border-radius: 10px;
    background: #ff3333;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px #ff3333;
  }
</style>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <h1>SLOPE 3D</h1>
  <button id="startBtn">START</button>
</div>

<!-- スコア表示 -->
<div id="ui">Score: 0</div>

<!-- Ready / Go -->
<div id="readyGo"></div>

<!-- ゲームオーバー画面 -->
<div id="gameOverScreen">
  <h1>GAME OVER</h1>
  <div id="finalScore"></div>
  <button id="restartBtn">RESTART</button>
</div>

<script>
// ===== Ready / Go 演出 =====
const readyGo = document.getElementById("readyGo");
function showText(text) {
  readyGo.innerText = text;
  readyGo.style.opacity = 1;
  setTimeout(() => readyGo.style.opacity = 0, 800);
}

// ===== Three.js 基本セットアップ =====
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 20, 300);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 6, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ===== ライト =====
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(5, 10, 5);
scene.add(dl);

// ===== 床テクスチャ（Slope3風ライン模様） =====
const canvas = document.createElement("canvas");
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext("2d");

// グラデーション背景
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, "#001133");
grad.addColorStop(1, "#000011");
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 512, 512);

// 光るライン
ctx.strokeStyle = "#00aaff";
ctx.lineWidth = 4;
for (let i = 0; i < 20; i++) {
  ctx.beginPath();
  ctx.moveTo(0, i * 25);
  ctx.lineTo(512, i * 25 + 50);
  ctx.stroke();
}

const slopeTexture = new THREE.CanvasTexture(canvas);
slopeTexture.wrapS = THREE.RepeatWrapping;
slopeTexture.wrapT = THREE.RepeatWrapping;
slopeTexture.repeat.set(1, 20);

// ===== スロープ =====
const slopeGeom = new THREE.PlaneGeometry(30, 2000, 10, 200);
slopeGeom.rotateX(-Math.PI / 2);
slopeGeom.rotateZ(0.3);

// 波打ち
for (let i = 0; i < slopeGeom.attributes.position.count; i++) {
  const z = slopeGeom.attributes.position.getZ(i);
  const wave = Math.sin(z * 0.03) * 1.2;
  slopeGeom.attributes.position.setY(i, wave);
}
slopeGeom.attributes.position.needsUpdate = true;

const slopeMat = new THREE.MeshPhongMaterial({
  map: slopeTexture,
  emissive: 0x000022,
  shininess: 30
});
const slope = new THREE.Mesh(slopeGeom, slopeMat);
slope.position.set(0, 0, -900);
scene.add(slope);

// ===== 壁（場外バグ対策） =====
function createWall(xPos) {
  const wallGeom = new THREE.BoxGeometry(1, 20, 2000);
  const wallMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
  const wall = new THREE.Mesh(wallGeom, wallMat);
  wall.position.set(xPos, 10, -900);
  scene.add(wall);
}
createWall(15);
createWall(-15);

// ===== プレイヤー（ボール） =====
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 32),
  new THREE.MeshPhongMaterial({ color: 0xff3333 })
);
ball.position.set(0, 3, 0);
scene.add(ball);

// ===== 障害物（種類＋動作付き） =====
const obstacles = [];
const obstacleTypes = [
  { geom: new THREE.BoxGeometry(2, 4, 2), type: "cube" },              // キューブ
  { geom: new THREE.CylinderGeometry(1, 1, 5), type: "cylinder" },     // 円柱
  { geom: new THREE.ConeGeometry(1.5, 4), type: "cone" },              // コーン

  { geom: new THREE.BoxGeometry(8, 2, 2), type: "wideBar" },           // 横長バー
  { geom: new THREE.BoxGeometry(1, 6, 1), type: "thinPole" },          // 細い柱
  { geom: new THREE.BoxGeometry(6, 0.5, 0.5), type: "lowBar" },        // 低いバー（ジャンプ必須）

  // 回転十字バー（2本の棒を組み合わせる）
  { geom: new THREE.BoxGeometry(6, 0.5, 0.5), type: "crossBar" }
];

const obstacleMat = new THREE.MeshPhongMaterial({ color: 0x00ff88 });

for (let i = 0; i < 100; i++) {
  const typeObj = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
  const mesh = new THREE.Mesh(typeObj.geom, obstacleMat);

  mesh.position.set((Math.random() - 0.5) * 20, 2, -20 - i * 20);
  mesh.obstacleType = typeObj.type;

  // 動作パラメータ
  mesh.moveSpeed = (Math.random() * 0.04) + 0.02;
  mesh.moveOffset = Math.random() * Math.PI * 2;
  mesh.rotateSpeed = Math.random() * 0.05;

  // 十字バーは追加パーツを付ける
  if (mesh.obstacleType === "crossBar") {
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 0.5), obstacleMat);
    bar2.rotation.y = Math.PI / 2;
    mesh.add(bar2);
  }

  scene.add(mesh);
  obstacles.push(mesh);
}


// ===== 入力 =====
const keys = { left: false, right: false, jump: false };
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Space") keys.jump = true;
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  if (e.code === "Space") keys.jump = false;
});

// ===== 物理・ゲーム状態 =====
let speedZ = 0;
let realSpeedZ = -1.2;
let startDelay = 2000;
let startTime = 0;

let speedX = 0;
let velY = 0;
let gravity = -0.03;
let onGround = true;
let gameOver = false;

// ===== スコア =====
let score = 0;
const ui = document.getElementById("ui");

// ===== 衝突判定 =====
function checkCollision() {
  for (const obs of obstacles) {
    const dx = ball.position.x - obs.position.x;
    const dz = ball.position.z - obs.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 2.5) {
      gameOver = true;
      showGameOver();
      break;
    }
  }
}

// ===== 場外バグ対策 =====
function keepInside() {
  if (ball.position.x > 14) ball.position.x = 14;
  if (ball.position.x < -14) ball.position.x = -14;
}

// ===== ゲームオーバー画面表示 =====
function showGameOver() {
  const screen = document.getElementById("gameOverScreen");
  const finalScore = document.getElementById("finalScore");
  finalScore.innerText = "Score: " + score;
  screen.style.display = "flex";
}

// ===== メインループ =====
function animate() {
  requestAnimationFrame(animate);

  let now = performance.now();
  if (now - startTime > startDelay) speedZ = realSpeedZ;

  if (!gameOver) {
    // スコア更新（Zの進行量）
    score = Math.floor(-ball.position.z);
    ui.innerText = "Score: " + score;

    // 横移動
    if (keys.left) speedX -= 0.05;
    if (keys.right) speedX += 0.05;
    speedX *= 0.9;
    ball.position.x += speedX;

    // ジャンプ
    if (keys.jump && onGround) {
      velY = 0.6;
      onGround = false;
    }
    velY += gravity;
    ball.position.y += velY;

    if (ball.position.y < 1.5) {
      ball.position.y = 1.5;
      velY = 0;
      onGround = true;
    }

    // 前進
    ball.position.z += speedZ;

    // 場外補正
    keepInside();

    // カメラ追従
    camera.position.x = ball.position.x * 0.6;
    camera.position.y = 6 + (ball.position.y - 1.5) * 0.3;
    camera.position.z = ball.position.z + 15;
    camera.lookAt(ball.position.x, ball.position.y, ball.position.z - 10);

　　obstacles.forEach(obs => {

    // 左右に揺れる（全タイプ共通）
      obs.position.x += Math.sin(performance.now() * 0.002 + obs.moveOffset) * obs.moveSpeed;

      // 回転（回転棒・十字バーは強め）
      if (obs.obstacleType === "crossBar") {
        obs.rotation.y += obs.rotateSpeed * 2;
      } else if (obs.obstacleType === "cube" || obs.obstacleType === "cylinder") {
        obs.rotation.y += obs.rotateSpeed;
      }

      // 低いバーは地面スレスレに配置
      if (obs.obstacleType === "lowBar") {
        obs.position.y = 1.0;
      }

      // 奥へループ
      if (obs.position.z > ball.position.z + 10) {
        obs.position.z -= 2000;
        obs.position.x = (Math.random() - 0.5) * 20;
      }
　　});


    // 衝突判定
    checkCollision();
  }

  renderer.render(scene, camera);
}

// ===== タイトル画面 → ゲーム開始 =====
document.getElementById("startBtn").onclick = () => {
  document.getElementById("titleScreen").style.display = "none";
  ui.style.display = "block";

  startTime = performance.now();

  setTimeout(() => showText("Ready"), 200);
  setTimeout(() => showText("Go!"), 1200);

  animate();
};

// ===== リスタート =====
document.getElementById("restartBtn").onclick = () => {
  location.reload();
};

// ===== リサイズ =====
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
