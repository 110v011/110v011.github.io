<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ビー玉ころがし（タイトル＋BGM）</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
  }
  #gameCanvas {
    background: #333;
    display: block;
    margin: 20px auto;
    border: 2px solid #555;
  }
</style>
</head>
<body>
<h1>ビー玉ころがし（タイトル＋BGM）</h1>

<div style="font-size:20px; margin-bottom:10px;">
  スコア：<span id="score">0</span> /
  耐久：<span id="hp">100</span>
</div>

<canvas id="gameCanvas" width="640" height="360"></canvas>

<!-- ★ BGM（あなたが bgm.mp3 を同じフォルダに置いてください） -->
<audio id="bgm" src="bgm.mp3" loop></audio>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreSpan = document.getElementById("score");
const hpSpan = document.getElementById("hp");
const bgm = document.getElementById("bgm");

// ゲーム状態
let gameState = "title"; // title / playing / clear / over

// ビー玉
const ball = {
  x: 80,
  y: 80,
  r: 15,
  vx: 0,
  vy: 0,
  hp: 100
};

let score = 0;
let camX = 0;
let camY = 0;

const CAMERA_SMOOTH = 0.05;
const CAMERA_DEADZONE = 30;
const CAMERA_MAX_SPEED = 30;

// キー入力
const keys = { left: false, right: false };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});

// ★ タイトル画面クリックでゲーム開始
canvas.addEventListener("click", () => {
  if (gameState === "title") {
    startGame();
  }
});

function startGame() {
  gameState = "playing";
  ball.x = 80;
  ball.y = 80;
  ball.vx = 0;
  ball.vy = 0;
  ball.hp = 100;
  score = 0;

  bgm.currentTime = 0;
  bgm.play();
}

// ★★★ コース自動生成（坂の上下制限付き） ★★★
function generateCourse() {
  const segments = [];
  const obstacles = [];
  const traps = [];

  let x = 40;
  let y = 200;

  while (x < 50000) {
    const type = Math.random();

    if (type < 0.55) {
      let ny = y + (Math.random() * 80 - 40);
      if (ny < 120) ny = y + Math.random() * 40;
      if (ny > 350) ny = y - Math.random() * 40;

      const nx = x + 200;
      segments.push({ x1: x, y1: y, x2: nx, y2: ny });
      x = nx; y = ny;

    } else if (type < 0.65) {
      const nx = x + 200;
      segments.push({ x1: x, y1: y, x2: nx, y2: y });
      x = nx;

    } else if (type < 0.80) {
      const nx = x + 150;
      const ny = y - 120;
      segments.push({ x1: x, y1: y, x2: nx, y2: ny });
      x = nx; y = ny;

      traps.push({ x: x + 80, y: y - 10, r: 20 });

      const nx2 = x + 200;
      segments.push({ x1: x, y1: y, x2: nx2, y2: y });
      x = nx2;

    } else if (type < 0.90) {
      
      const nx = x + 200;
      segments.push({ x1: x, y1: y, x2: nx, y2: y });
      x = nx;

    } else {
      const nx = x + 200;
      segments.push({ x1: x, y1: y, x2: nx, y2: y });
      x = nx;
    }
  }

  return { segments, obstacles, traps, goalX: x };
}

const { segments, obstacles, traps, goalX } = generateCourse();


// ★★★ すり抜け防止の完全安定版 ★★★
function collideSegment(ball, seg) {
  const dx = seg.x2 - seg.x1;
  const dy = seg.y2 - seg.y1;
  const len = Math.hypot(dx, dy);

  const ux = dx / len;
  const uy = dy / len;

  const bx = ball.x - seg.x1;
  const by = ball.y - seg.y1;

  let t = bx * ux + by * uy;
  if (t < 0) t = 0;
  if (t > len) t = len;

  const closestX = seg.x1 + ux * t;
  const closestY = seg.y1 + uy * t;

  const dx2 = ball.x - closestX;
  const dy2 = ball.y - closestY;
  const dist = Math.hypot(dx2, dy2);

  if (dist < ball.r) {
    const nx = dx2 / dist;
    const ny = dy2 / dist;

    const penetration = ball.r - dist;

    ball.x += nx * penetration * 1.3;
    ball.y += ny * penetration * 1.3;

    const vn = ball.vx * nx + ball.vy * ny;
    const vt = ball.vx * ux + ball.vy * uy;

    const bounce = -0.05;
    const newVn = vn * bounce;

    ball.vx = newVn * nx + vt * ux;
    ball.vy = newVn * ny + vt * uy;

    if (dy < -60) {
      ball.vy -= 5;
    }

    return true;
  }

  return false;
}

function collideObstacle(ball, obs) {
  const dx = ball.x - obs.x;
  const dy = ball.y - obs.y;
  const dist = Math.hypot(dx, dy);

  if (dist < ball.r + obs.r) {
    ball.vx *= -0.8;
    ball.vy *= -0.8;
    ball.hp -= 5;
  }
}

function collideTrap(ball, trap) {
  const dx = ball.x - trap.x;
  const dy = ball.y - trap.y;
  const dist = Math.hypot(dx, dy);

  if (dist < ball.r + trap.r) {
    ball.hp -= 0.5;
  }
}

const gravity = 0.25;
const friction = 0.99;
const controlForce = 0.3;

function update() {
  if (gameState !== "playing") return;

  if (keys.left)  ball.vx -= controlForce;
  if (keys.right) ball.vx += controlForce;

  ball.vy += gravity;

  ball.vx *= friction;
  ball.vy *= friction;

  ball.x += ball.vx;
  ball.y += ball.vy;

  let onGround = false;
  for (const seg of segments) {
    if (collideSegment(ball, seg)) {
      onGround = true;
    }
  }

  for (const obs of obstacles) collideObstacle(ball, obs);
  for (const trap of traps) collideTrap(ball, trap);

  if (onGround) {
    score += 0.2;
    scoreSpan.textContent = Math.floor(score);
  }

  hpSpan.textContent = Math.floor(ball.hp);

  if (ball.hp <= 0) {
    gameState = "over";
    bgm.pause();
  }

  if (ball.x > goalX) {
    gameState = "clear";
    bgm.pause();
  }

  // ★★★ 超滑らかカメラ追従 ★★★
  camX += (ball.x - camX - 200) * CAMERA_SMOOTH;

  let targetY = ball.y - 180;
  let diffY = targetY - camY;

  if (Math.abs(diffY) < CAMERA_DEADZONE) diffY = 0;

  diffY = Math.max(-CAMERA_MAX_SPEED, Math.min(CAMERA_MAX_SPEED, diffY));

  camY += diffY * CAMERA_SMOOTH;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === "title") {
    drawTitle();
    return;
  }

  ctx.save();
  ctx.translate(-camX, -camY);

  // コース
  ctx.strokeStyle = "#88c";
  ctx.lineWidth = 10;
  ctx.beginPath();
  for (const seg of segments) {
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
  }
  ctx.stroke();

  // 障害物
  ctx.fillStyle = "#f00";
  for (const obs of obstacles) {
    ctx.beginPath();
    ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // トラップ
  ctx.fillStyle = "#ff0";
  for (const trap of traps) {
    ctx.beginPath();
    ctx.arc(trap.x, trap.y, trap.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ゴール
  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(goalX, 0);
  ctx.lineTo(goalX, 400);
  ctx.stroke();

  // ビー玉
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#0ff";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.stroke();

  ctx.restore();

  if (gameState === "clear") {
    ctx.fillStyle = "#0f0";
    ctx.font = "40px sans-serif";
    ctx.fillText("クリア！", canvas.width / 2 - 60, canvas.height / 2);
  }

  if (gameState === "over") {
    ctx.fillStyle = "#f00";
    ctx.font = "40px sans-serif";
    ctx.fillText("ゲームオーバー", canvas.width / 2 - 120, canvas.height / 2);
  }
}

function drawTitle() {
  ctx.fillStyle = "#fff";
  ctx.font = "40px sans-serif";
  ctx.fillText("ビー玉ころがし", canvas.width / 2 - 120, canvas.height / 2 - 40);

  ctx.font = "24px sans-serif";
  ctx.fillText("クリックでスタート", canvas.width / 2 - 100, canvas.height / 2 + 20);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
